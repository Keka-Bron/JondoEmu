syntax = "proto3";
package fixture;
option csharp_namespace = "Jondo.Unity.Protocol.Connection.Tests.Fixtures.Wire";

// Two invented builds of the same stable protocol. No production aliases/tags.
enum mode { ZERO = 0; ALLOWED = 3; UNMAPPED = 7; }
message a_root {
  oneof choice { a_payload item = 7; a_empty empty = 8; a_empty unmapped = 13; }
}
message a_payload {
  optional int32 count = 2;
  repeated sint64 ids = 4;
  mode state = 5;
  a_empty child = 6;
  string decoy = 9;
  a_empty required_child = 10;
  optional uint32 telemetry = 11;
  bytes opaque = 12;
  repeated wire_only_detail samples = 13;
  map<string, wire_only_detail> attributes = 14;
  wire_only_mode wire_state = 15;
  oneof wire_only_choice { wire_only_detail detail = 16; bool flag = 17; }
}
message wire_only_detail { bytes data = 1; }
enum wire_only_mode { INITIAL = 0; OTHER = 1; }
message a_empty {}
message b_root {
  oneof another_choice { b_payload other_item = 11; a_empty other_empty = 12; }
}
message b_payload {
  optional int32 other_count = 3;
  repeated sint64 other_ids = 5;
  mode other_state = 6;
  a_empty other_child = 7;
  string other_decoy = 10;
  a_empty other_required_child = 11;
}

message advanced {
  bytes data = 1;
  optional string title = 2;
  optional bytes blob = 3;
  optional mode state = 4;
  map<int32, defaults_payload> children = 5;
  defaults_payload missing_default = 6;
  oneof choice { int64 number = 7; a_empty empty = 8; bool unsupported = 9; }
  oneof construction { a_empty default_branch = 10; string other_branch = 11; }
}
message defaults_payload { int32 count = 1; string text = 2; }

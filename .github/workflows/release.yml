name: Release

# Builds the Windows and Linux applications, runs the tests on both and creates a draft release
# with a zip for each.
# The .exe are not versioned in git any more: this is where they come from.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA to release (empty = latest commit of the selected branch)
        required: false
        type: string
        default: ''
      bump:
        description: Version bump
        required: false
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

# Two releases at once would both read the same last tag and compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      release_id: ${{ steps.draft.outputs.id }}

    steps:
      - name: Check the commit input
        shell: bash
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          if [[ -n "$COMMIT" && ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::'commit' must be a full 40-character SHA, got '$COMMIT'"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit || github.sha }}
          # The whole history, so that the version tags are there.
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      # The last vX.Y.Z tag in the repository, bumped. With no tag yet, the first one is 0.1.0.
      - name: Compute version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          last=$({ git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sed -n 1p)

          if [[ -z "$last" ]]; then
            version=0.1.0
            echo "No version tag found; starting at $version"
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "::error::Unknown bump '$BUMP'"; exit 1 ;;
            esac
            version="$major.$minor.$patch"
            echo "Last tag $last, $BUMP bump -> $version"
          fi

          {
            echo "version=$version"
            echo "tag=v$version"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # Same as in CI: without world.db some 64 tests skip themselves and count as passed.
      - name: Unpack world.db
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bases | Out-Null
          Expand-Archive -Path datos/world.zip -DestinationPath bases -Force
          Get-Item bases/world.db | Select-Object Name,Length

      - name: Restore
        run: dotnet restore Jondo.Unity.sln

      - name: Build
        run: dotnet build Jondo.Unity.sln --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test Jondo.Unity.Tests/Jondo.Unity.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Test optional server modules
        shell: pwsh
        run: ./.github/scripts/Test-ServerModules.ps1

      # SkipTests: the tests have just run in the step above, so the publish gate would only run
      # them a second time. Each project's deploy target copies its .exe to the root, as it does
      # locally, which is where the next step picks them up.
      - name: Publish
        shell: pwsh
        run: |
          $projects = 'Jondo.Unity.Server', 'Jondo.Unity.Launcher', 'Jondo.Unity.Studio'
          foreach ($project in $projects) {
            dotnet publish "$project/$project.csproj" --configuration Release --no-restore `
              -p:Version=${{ steps.version.outputs.version }} `
              -p:JondoRepository=${{ github.repository }} `
              -p:SkipTests=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # The Windows release: the setup players download (the launcher, self-contained, which is
      # also the launcher's own update), the full zip (a folder that runs as it is unpacked,
      # JondoEmu/ at its root), the server and Studio as assets of their own and the manifest the
      # launcher updates from -- every file with its hash, the versioned ones fetched from the
      # repository at the tag. See the script.
      - name: Package
        shell: pwsh
        run: |
          ./.github/scripts/New-JondoRelease.ps1 -Tag '${{ steps.version.outputs.tag }}' -Platform win-x64 -OutDir release `
            -Executables @{
              'Jondo Emulator Launcher.exe' = 'Jondo Emulator Launcher.exe'
              'Jondo Server.exe' = 'Jondo Server.exe'
              'Jondo Studio.exe' = 'Jondo Studio.exe'
            }

      - name: Package optional server mods
        shell: pwsh
        run: ./.github/scripts/New-ServerModPackages.ps1 -OutDir release

      # The notes open with the one file to download for each system: the release also carries
      # what the launcher fetches by itself, and nothing on the page tells them apart otherwise.
      # GitHub puts the generated notes after this body.
      - name: Create draft release
        id: draft
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          commit: ${{ steps.version.outputs.sha }}
          draft: true
          generateReleaseNotes: true
          body: |
            ## Download

            - **Windows:** [**JondoEmu-Setup-win-x64.exe**](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/JondoEmu-Setup-win-x64.exe)
            - **Linux:** [**JondoEmu-Setup-linux-x64**](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/JondoEmu-Setup-linux-x64) (make it executable first: `chmod +x JondoEmu-Setup-linux-x64`)

            Download the setup for your system to install the emulator and fetch the Dofus client. The platform ZIPs are ready to unpack for a manual installation.

            Server operators can extract any of the optional `*-server-mod.zip` archives into `mods/` at the emulator root, add the mod ID to `ServerMods` in `config/server_settings.json`, and restart the server. The same mod archives work with the Windows and Linux servers.

          artifacts: release/*.zip,release/*.exe,release/*.json
          artifactErrorsFailBuild: true

      # The test results stay with the run, not among the files players see.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  # The Linux release: the same folder as the Windows one with the three tools built for
  # linux-x64 (the mods ride along unused: the native Linux client has no mod loader), its
  # executables as assets, its setup and its manifest. The server's publish runs the whole test
  # suite first, here on Linux. zip keeps the executables' Unix permissions, so they run as
  # unpacked.
  linux:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Unpack world.db
        run: unzip -o datos/world.zip -d bases
      - name: Test optional server modules
        shell: pwsh
        run: ./.github/scripts/Test-ServerModules.ps1 -ArtifactsPath host-artifacts
      - name: Publish and test the Linux tools
        run: |
          dotnet publish Jondo.Unity.Server/Jondo.Unity.Server.csproj --configuration Release -r linux-x64 \
            --artifacts-path host-artifacts -p:Version=${{ needs.release.outputs.version }} -p:SkipRootDeploy=true --nologo
          for project in Jondo.Unity.Launcher Jondo.Unity.Studio; do
            dotnet publish "$project/$project.csproj" --configuration Release -r linux-x64 \
              --artifacts-path host-artifacts -p:Version=${{ needs.release.outputs.version }} \
              -p:JondoRepository=${{ github.repository }} \
              -p:SkipTests=true -p:SkipRootDeploy=true --nologo
          done
      - name: Package
        shell: pwsh
        run: |
          $published = 'host-artifacts/publish'
          ./.github/scripts/New-JondoRelease.ps1 -Tag '${{ needs.release.outputs.tag }}' -Platform linux-x64 -OutDir host-artifacts/release `
            -Executables @{
              'Jondo Server' = "$published/Jondo.Unity.Server/release_linux-x64/Jondo Server"
              'Jondo Emulator Launcher' = "$published/Jondo.Unity.Launcher/release_linux-x64/Jondo Emulator Launcher"
              'Jondo Studio' = "$published/Jondo.Unity.Studio/release_linux-x64/Jondo Studio"
            }
      # By the draft's id, not its tag: a draft has no tag yet, so an older draft of the same
      # version (one never published) answers to it too, and `gh release upload <tag>` took the
      # first one -- whose Linux files were already there.
      - name: Attach the Linux files to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: |
          for file in host-artifacts/release/*; do
            name=$(basename "$file")
            curl --fail-with-body -sS -X POST               -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"               -H "Content-Type: application/octet-stream" --data-binary @"$file"               "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$(jq -rn --arg n "$name" '$n|@uri')"               > /dev/null
            echo "Attached $name"
          done

name: Release

# Builds the Windows and Linux applications, runs the tests on both and creates a draft release
# with a zip for each.
# The .exe are not versioned in git any more: this is where they come from.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA to release (empty = latest commit of the selected branch)
        required: false
        type: string
        default: ''
      bump:
        description: Version bump
        required: false
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

# Two releases at once would both read the same last tag and compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}

    steps:
      - name: Check the commit input
        shell: bash
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          if [[ -n "$COMMIT" && ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::'commit' must be a full 40-character SHA, got '$COMMIT'"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit || github.sha }}
          # The whole history, so that the version tags are there.
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      # The last vX.Y.Z tag in the repository, bumped. With no tag yet, the first one is 0.1.0.
      - name: Compute version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          last=$({ git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sed -n 1p)

          if [[ -z "$last" ]]; then
            version=0.1.0
            echo "No version tag found; starting at $version"
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "::error::Unknown bump '$BUMP'"; exit 1 ;;
            esac
            version="$major.$minor.$patch"
            echo "Last tag $last, $BUMP bump -> $version"
          fi

          {
            echo "version=$version"
            echo "tag=v$version"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # Same as in CI: without world.db some 64 tests skip themselves and count as passed.
      - name: Unpack world.db
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bases | Out-Null
          Expand-Archive -Path datos/world.zip -DestinationPath bases -Force
          Get-Item bases/world.db | Select-Object Name,Length

      - name: Restore
        run: dotnet restore Jondo.Unity.sln

      - name: Build
        run: dotnet build Jondo.Unity.sln --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test Jondo.Unity.Tests/Jondo.Unity.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      # SkipTests: the tests have just run in the step above, so the publish gate would only run
      # them a second time. Each project's deploy target copies its .exe to the root, as it does
      # locally, which is where the next step picks them up.
      - name: Publish
        shell: pwsh
        run: |
          $projects = 'Jondo.Unity.Server', 'Jondo.Unity.Launcher', 'Jondo.Unity.Studio'
          foreach ($project in $projects) {
            dotnet publish "$project/$project.csproj" --configuration Release --no-restore `
              -p:Version=${{ steps.version.outputs.version }} `
              -p:SkipTests=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # The Windows zip, a folder that runs as it is unpacked, with the data taken by git archive
      # so that only what is versioned goes in and nothing the tests wrote (bases/, logs/): the
      # three .exe and everything the server reads next to it -- datos/ (world.zip among it),
      # content/, launcher_assets/, the two mods (JondoFix, Cazacabezas) and the root marker. A
      # player whose server runs elsewhere takes the same zip and starts only the launcher.
      #
      # The folder is called JondoEmu because that is one of the names JondoFix looks for beside
      # the client's folder when JONDO_EMULATOR_ROOT is not set.
      - name: Package
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          New-Item -ItemType Directory -Force release | Out-Null

          function New-ReleaseZip([string]$name, [string[]]$exes, [string[]]$data) {
            $stage = "stage/$name/JondoEmu"
            New-Item -ItemType Directory -Force $stage | Out-Null
            git archive --format=tar --output="stage/$name.tar" HEAD -- $data
            if ($LASTEXITCODE -ne 0) { throw "git archive failed for $name" }
            tar -xf "stage/$name.tar" -C $stage
            if ($LASTEXITCODE -ne 0) { throw "tar failed for $name" }
            Copy-Item -LiteralPath $exes -Destination $stage
            Compress-Archive -Path $stage -DestinationPath "release/$name.zip"
          }

          New-ReleaseZip "Jondo-Full-$tag-win-x64" `
            -exes 'Jondo Emulator Launcher.exe', 'Jondo Server.exe', 'Jondo Studio.exe' `
            -data '.jondo-root', 'datos', 'content', 'launcher_assets', 'JondoFix/JondoFix.dll', 'Cazacabezas/Cazacabezas.dll'

          Get-ChildItem release | Select-Object Name,Length

      - name: Create draft release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          commit: ${{ steps.version.outputs.sha }}
          draft: true
          generateReleaseNotes: true
          artifacts: release/*.zip,TestResults/tests.trx
          artifactErrorsFailBuild: true

  # The Linux zip: the same folder as the Windows Full zip, with the three tools built for
  # linux-x64 and without the two mods (the native Linux client has no mod loader). The server's
  # publish runs the whole test suite first, here on Linux. zip keeps the executables' Unix
  # permissions, so they run as unpacked.
  linux:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Unpack world.db
        run: unzip -o datos/world.zip -d bases
      - name: Publish and test the Linux tools
        run: |
          dotnet publish Jondo.Unity.Server/Jondo.Unity.Server.csproj --configuration Release -r linux-x64 \
            --artifacts-path host-artifacts -p:Version=${{ needs.release.outputs.version }} -p:SkipRootDeploy=true --nologo
          for project in Jondo.Unity.Launcher Jondo.Unity.Studio; do
            dotnet publish "$project/$project.csproj" --configuration Release -r linux-x64 \
              --artifacts-path host-artifacts -p:Version=${{ needs.release.outputs.version }} \
              -p:SkipTests=true -p:SkipRootDeploy=true --nologo
          done
      - name: Package
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          stage="host-artifacts/stage/JondoEmu"
          mkdir -p "$stage" host-artifacts/release
          git archive HEAD -- .jondo-root datos content launcher_assets | tar -xf - -C "$stage"
          cp 'host-artifacts/publish/Jondo.Unity.Server/release_linux-x64/Jondo Server' \
             'host-artifacts/publish/Jondo.Unity.Launcher/release_linux-x64/Jondo Emulator Launcher' \
             'host-artifacts/publish/Jondo.Unity.Studio/release_linux-x64/Jondo Studio' "$stage/"
          chmod +x "$stage/Jondo Server" "$stage/Jondo Emulator Launcher" "$stage/Jondo Studio"
          cp docs/linux-desktop.md "$stage/README-linux.md"
          command -v zip >/dev/null || sudo apt-get install -y zip
          (cd host-artifacts/stage && zip -qr "../release/Jondo-Full-$TAG-linux-x64.zip" JondoEmu)
          ls -l host-artifacts/release
      - name: Attach the Linux zip to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" "host-artifacts/release/Jondo-Full-$TAG-linux-x64.zip"

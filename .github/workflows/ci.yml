name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      # Without this the green lies. Some 64 tests skip themselves when they do not find
      # bases/world.db —which is not versioned— and xunit counts them as PASSED, not as skipped:
      # the tick comes out green having checked a good deal less than it seems. datos/world.zip
      # is in git and carries world.db inside, so it is unzipped before anything else.
      - name: Unpack world.db
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bases | Out-Null
          Expand-Archive -Path datos/world.zip -DestinationPath bases -Force
          Get-Item bases/world.db | Select-Object Name,Length

      - name: Restore
        run: dotnet restore Jondo.Unity.sln

      - name: Build
        run: dotnet build Jondo.Unity.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Jondo.Unity.Tests/Jondo.Unity.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - name: Test connection protocol
        run: dotnet test Jondo.Unity.Protocol.Connection.Tests/Jondo.Unity.Protocol.Connection.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=connection-protocol.trx" --results-directory TestResults

      - name: Test server transport and desktop
        run: dotnet test Jondo.Unity.Server.Tests/Jondo.Unity.Server.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=connection-server.trx" --results-directory TestResults

      # Each failed test as an annotation, readable without signing in -- the log and the trx are
      # not: the run's page and its API show the annotations to anybody.
      - name: Annotate failed tests
        if: failure()
        shell: pwsh
        run: |
          foreach ($trx in Get-ChildItem TestResults -Filter *.trx -ErrorAction SilentlyContinue) {
            [xml]$doc = Get-Content $trx.FullName
            $failed = $doc.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' }
            foreach ($t in $failed) {
              $message = ($t.Output.ErrorInfo.Message -replace "`r?`n", ' | ')
              if ($message.Length -gt 600) { $message = $message.Substring(0, 600) }
              Write-Output "::error title=Failed test::$($t.testName): $message"
            }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  build-and-test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JONDO_EMULATOR_ROOT: ${{ github.workspace }}
      XDG_CONFIG_HOME: ${{ github.workspace }}/host-artifacts/test-profile/config
      XDG_DATA_HOME: ${{ github.workspace }}/host-artifacts/test-profile/data
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Unpack world.db
        run: unzip -o datos/world.zip -d bases
      - name: Build solution on Linux
        run: dotnet build Jondo.Unity.sln --configuration Release --artifacts-path host-artifacts --nologo
      - name: Test general suite
        run: dotnet test Jondo.Unity.Tests/Jondo.Unity.Tests.csproj --configuration Release --no-build --artifacts-path host-artifacts --nologo --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Test generated protocol and mappings
        run: dotnet test Jondo.Unity.Protocol.Connection.Tests/Jondo.Unity.Protocol.Connection.Tests.csproj --configuration Release --no-build --artifacts-path host-artifacts --nologo --logger "trx;LogFileName=connection-protocol.trx" --results-directory TestResults
      - name: Test server transport and headless desktop rendering
        run: dotnet test Jondo.Unity.Server.Tests/Jondo.Unity.Server.Tests.csproj --configuration Release --no-build --artifacts-path host-artifacts --nologo --logger "trx;LogFileName=connection-server.trx" --results-directory TestResults
      - name: Publish Linux desktop tools locally
        run: |
          for project in Jondo.Unity.Launcher Jondo.Unity.Studio Jondo.Unity.Deobfuscator; do
            dotnet publish "$project/$project.csproj" --configuration Release -r linux-x64 --artifacts-path host-artifacts -p:SkipRootDeploy=true --nologo
          done
      - name: Publish Linux server desktop
        run: dotnet publish Jondo.Unity.Server/Jondo.Unity.Server.csproj --configuration Release -r linux-x64 --artifacts-path host-artifacts -p:SkipTests=true -p:SkipRootDeploy=true --nologo
      - name: Cross-publish Windows server desktop
        run: dotnet publish Jondo.Unity.Server/Jondo.Unity.Server.csproj --configuration Release -r win-x64 --artifacts-path host-artifacts/windows-check -p:SkipTests=true -p:SkipRootDeploy=true --nologo
      - name: Cross-publish Windows desktop tools
        run: |
          for project in Jondo.Unity.Launcher Jondo.Unity.Studio Jondo.Unity.Deobfuscator; do
            dotnet publish "$project/$project.csproj" --configuration Release -r win-x64 --artifacts-path host-artifacts/windows-check -p:SkipTests=true -p:SkipRootDeploy=true --nologo
          done
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
